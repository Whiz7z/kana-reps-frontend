  <title>KanaReps</title>
  <link id="favicon" rel="icon" href="/favicon-dark.svg" type="image/svg+xml" />

  <script>
    (function () {
      try {
        var k = "kana-reps-color-mode";
        var t = localStorage.getItem(k);
        var light = t === "light";
        /* Default theme is dark; only skip when user explicitly chose light */
        if (!light) {
          document.documentElement.classList.add("dark");
        }
        var icon = document.getElementById("favicon");
        if (icon) icon.setAttribute("href", light ? "/favicon.svg" : "/favicon-dark.svg");
      } catch (e) { }
    })();
  </script>
